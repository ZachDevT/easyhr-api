        id: { $ref: '#/components/schemas/Id' }
        organizationId: { $ref: '#/components/schemas/Id' }
        requestType: { type: string, enum: [deletion, export] }
        subjectEmail: { type: string }
        status: { type: string }
        resolutionNotes: { type: string }
    FeatureFlag:
      type: object
      required: [id, key, defaultEnabled]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        key: { type: string }
        description: { type: string }
        defaultEnabled: { type: boolean }
    FeatureFlagResult:
      type: object
      required: [key, enabled]
      properties:
        key: { type: string }
        enabled: { type: boolean }
    SetFeatureOverride:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    Role:
      type: object
      required: [id, name, isCustom]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        description: { type: string }
        isCustom: { type: boolean }
    CreateRole:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
    UpdateRolePermissions:
      type: object
      required: [permissionNames]
      properties:
        permissionNames:
          type: array
          items: { type: string }
    AssignRole:
      type: object
      required: [roleId]
      properties:
        roleId: { $ref: '#/components/schemas/Id' }
    AuditEvent:
      type: object
      required: [id, aggregateId, aggregateType, eventType, timestamp]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        organizationId: { $ref: '#/components/schemas/Id' }
        aggregateId: { $ref: '#/components/schemas/Id' }
        aggregateType: { type: string }
        eventType: { type: string }
        userId: { $ref: '#/components/schemas/Id' }
        timestamp: { type: string, format: date-time }

  responses:
    Problem:
      description: RFC 9457-style API problem
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Id:
      type: string
      format: uuid
    SessionContextResponse:
      type: object
      required: [userId, membershipId, organizationId, permissions]
      properties:
        userId: { $ref: '#/components/schemas/Id' }
        membershipId: { $ref: '#/components/schemas/Id' }
        organizationId: { $ref: '#/components/schemas/Id' }
        permissions:
          type: array
          items: { type: string, example: 'employees:read' }
    OrganizationSetupRequest:
      type: object
      required: [legalName, displayName, countryCode, timezone, currencyCode, subdomain, brandColor]
      properties:
        legalName: { type: string, minLength: 1, maxLength: 200 }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        registrationNumber: { type: string, maxLength: 255 }
        taxIdentifier: { type: string, maxLength: 255 }
        countryCode: { type: string, enum: [UG, KE, RW, TZ, US, GB] }
        timezone: { type: string, example: Africa/Kampala }
        currencyCode: { type: string, pattern: '^[A-Z]{3}$', example: UGX }
        industry: { type: string, maxLength: 160 }
        companySizeBand: { type: string, maxLength: 80 }
        websiteUrl: { type: string, format: uri }
        contactEmail: { type: string, format: email }
        contactPhone: { type: string, maxLength: 64 }
        subdomain: { type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$' }
        brandColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        initialDepartments:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 160 }
        socialLinks:
          type: object
          additionalProperties: false
          properties:
            linkedin: { type: string, format: uri }
            x: { type: string, format: uri }
            facebook: { type: string, format: uri }
            tiktok: { type: string, format: uri }
            glassdoor: { type: string, format: uri }
        headquarters:
          type: object
          properties:
            name: { type: string, maxLength: 160 }
            countryCode: { type: string, pattern: '^[A-Z]{2}$' }
            timezone: { type: string }
            geofence:
              type: object
              required: [latitude, longitude, radiusMeters, accuracyToleranceMeters]
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                radiusMeters: { type: integer, minimum: 10, maximum: 100000 }
                accuracyToleranceMeters: { type: integer, minimum: 0, maximum: 1000 }
    OrganizationSetupResponse:
      type: object
      required: [organizationId, workspaceId, membershipId, subdomain]
      properties:
        organizationId: { $ref: '#/components/schemas/Id' }
        workspaceId: { $ref: '#/components/schemas/Id' }
        membershipId: { $ref: '#/components/schemas/Id' }
        subdomain: { type: string }
    User:
      type: object
      required: [id, email, firstName, lastName]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
    Organization:
      type: object
      required: [id, name, timezone, countryCode]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        timezone: { type: string, example: Africa/Kampala }
        countryCode: { type: string, pattern: '^[A-Z]{2}$', example: UG }
    Membership:
      type: object
      required: [id, roleKeys]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        roleKeys: { type: array, items: { type: string } }
    EmployeeStatus:
      type: string
      enum: [active, onboarding, leave, suspended, terminated]
    Department:
      type: object
      required: [id, name, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        code: { type: [string, 'null'] }
        divisionId: { type: [string, 'null'], format: uuid }
        parentDepartmentId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [active, archived] }
    Division:
      type: object
      required: [id, name, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        code: { type: [string, 'null'] }
        status: { type: string, enum: [active, archived] }
    CreateDivisionRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        code: { type: string, maxLength: 80 }
    CreateDepartmentRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        code: { type: string, maxLength: 80 }
        divisionId: { type: string, format: uuid }
        parentDepartmentId: { type: string, format: uuid }
    Employee:
      type: object
      required: [id, firstName, lastName, workEmail, status, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        firstName: { type: string }
        lastName: { type: string }
        workEmail: { type: string, format: email }
        personalEmail: { type: [string, 'null'], format: email }
        status: { $ref: '#/components/schemas/EmployeeStatus' }
        departmentId: { type: [string, 'null'], format: uuid }
        managerId: { type: [string, 'null'], format: uuid }
        jobTitle: { type: [string, 'null'] }
        startDate: { type: [string, 'null'], format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateEmployeeRequest:
      type: object
      required: [employeeNumber, firstName, lastName, workEmail, hiredOn, employmentType, workerType, workArrangement, fteBasisPoints, payType, jobTitle]
      properties:
        employeeNumber: { type: string, minLength: 1, maxLength: 80 }
        firstName: { type: string, minLength: 1, maxLength: 120 }
        lastName: { type: string, minLength: 1, maxLength: 120 }
        workEmail: { type: string, format: email }
        personalEmail: { type: string, format: email }
        departmentId: { $ref: '#/components/schemas/Id' }
        managerId: { $ref: '#/components/schemas/Id' }
        jobTitle: { type: string, maxLength: 160 }
        hiredOn: { type: string, format: date }
        employmentType: { type: string, enum: [full_time, part_time, fixed_term, contractor, intern] }
        workerType: { type: string, enum: [employee, contractor] }
        workArrangement: { type: string, enum: [on_site, hybrid, remote] }
        fteBasisPoints: { type: integer, minimum: 1, maximum: 10000, example: 10000 }
        payType: { type: string, enum: [salary, hourly] }
        jobTitle: { type: string, minLength: 1, maxLength: 160 }
        divisionId: { $ref: '#/components/schemas/Id' }
        locationId: { $ref: '#/components/schemas/Id' }
    CreateEmployeeResponse:
      type: object
      required: [id, firstName, lastName, workEmail, status, hiredOn]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        firstName: { type: string }
        lastName: { type: string }
        workEmail: { type: string, format: email }
        status: { $ref: '#/components/schemas/EmployeeStatus' }
        hiredOn: { type: string, format: date }
    UpdateEmployeeRequest:
      type: object
      minProperties: 1
      properties:
        firstName: { type: string, minLength: 1, maxLength: 120 }
        lastName: { type: string, minLength: 1, maxLength: 120 }
        personalEmail: { type: [string, 'null'], format: email }
        departmentId: { type: [string, 'null'], format: uuid }
        managerId: { type: [string, 'null'], format: uuid }
        jobTitle: { type: string, minLength: 1, maxLength: 160 }
    EmployeePage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Employee' } }
        page: { $ref: '#/components/schemas/CursorPage' }
    CursorPage:
      type: object
      required: [limit, hasMore]
      properties:
        nextCursor: { type: [string, 'null'] }
        limit: { type: integer }
        hasMore: { type: boolean }
    LeaveBalance:
      type: object
      required: [employeeId, leaveTypeId, availableMinutes, reservedMinutes, asOf]
      properties:
        employeeId: { $ref: '#/components/schemas/Id' }
        leaveTypeId: { $ref: '#/components/schemas/Id' }
        availableMinutes: { type: integer, minimum: 0 }
        reservedMinutes: { type: integer, minimum: 0 }
        asOf: { type: string, format: date-time }
    LeaveRequestStatus:
      type: string
      enum: [pending_manager, pending_hr, approved, declined, cancelled]
    LeaveRequest:
      type: object
      required: [id, employeeId, leaveTypeId, startDate, endDate, requestedMinutes, status, submittedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        employeeId: { $ref: '#/components/schemas/Id' }
        leaveTypeId: { $ref: '#/components/schemas/Id' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        requestedMinutes: { type: integer, minimum: 1 }
        reason: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/LeaveRequestStatus' }
        submittedAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
    CreateLeaveRequest:
      type: object
      required: [leaveTypeId, startDate, endDate]
      properties:
        leaveTypeId: { $ref: '#/components/schemas/Id' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        reason: { type: string, maxLength: 2000 }
    LeaveRequestPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/LeaveRequest' } }
        page: { $ref: '#/components/schemas/CursorPage' }
    LeaveRequestDecision:
      type: object
      required: [id, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/LeaveRequestStatus' }
    CreateAttendancePunch:
      type: object
      required: [kind, occurredAt, source]
      properties:
        employeeId:
          description: Required only for an authorized kiosk/manager flow; ignored/rejected for self-service if it differs from the caller's employee identity.
          allOf: [{ $ref: '#/components/schemas/Id' }]
        kind: { type: string, enum: [clock_in, clock_out, break_start, break_end] }
        occurredAt: { type: string, format: date-time }
        source: { type: string, enum: [web, mobile, kiosk, manager_override] }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        deviceId: { type: string, maxLength: 255 }
    AttendancePunch:
      type: object
      required: [id, employeeId, kind, occurredAt, source, policyOutcome, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        employeeId: { $ref: '#/components/schemas/Id' }
        kind: { type: string, enum: [clock_in, clock_out, break_start, break_end] }
        occurredAt: { type: string, format: date-time }
        source: { type: string }
        policyOutcome: { type: string, enum: [not_evaluated, allowed, outside_geofence, needs_review] }
        createdAt: { type: string, format: date-time }
    AttendancePunchPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AttendancePunch' } }
        page: { $ref: '#/components/schemas/CursorPage' }
    CreateAttendanceCorrection:
      type: object
      required: [occurredAt, reason]
      properties:
        occurredAt: { type: string, format: date-time }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    LiveAttendance:
      type: object
      required: [employeeId, date, status]
      properties:
        employeeId: { $ref: '#/components/schemas/Id' }
        date: { type: string, format: date }
        status: { type: string, enum: [clocked_in, clocked_out, late, missing] }
        clockInAt: { type: [string, 'null'], format: date-time }
        clockOutAt: { type: [string, 'null'], format: date-time }
        lateMinutes: { type: integer, minimum: 0 }
    LiveAttendancePage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/LiveAttendance' } }
        page: { $ref: '#/components/schemas/CursorPage' }
    OnboardingTemplate:
      type: object
      required: [id, name, version, status, taskCount]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, published, archived] }
        taskCount: { type: integer, minimum: 0 }
    CreateOnboardingTemplate:
      type: object
      required: [name, tasks]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        tasks:
          type: array
          maxItems: 100
          items:
            type: object
            required: [title, category, assigneeType, dueOffsetDays, isRequired, sortOrder]
            properties:
              title: { type: string, minLength: 1, maxLength: 200 }
              description: { type: string, maxLength: 4000 }
              category: { type: string, enum: [it_setup, hr, facilities, training, documents, other] }
              assigneeType: { type: string, enum: [employee, manager, hr_team, it_team, facilities_team] }
              dueOffsetDays: { type: integer, minimum: -90, maximum: 365 }
              isRequired: { type: boolean }
              sortOrder: { type: integer, minimum: 0 }
    CreateOnboardingInstance:
      type: object
      required: [employeeId, templateId, startDate]
      properties:
        employeeId: { $ref: '#/components/schemas/Id' }
        templateId: { $ref: '#/components/schemas/Id' }
        startDate: { type: string, format: date }
    OnboardingInstance:
      type: object
      required: [id, employeeId, templateId, status, progressPercent, tasks]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        employeeId: { $ref: '#/components/schemas/Id' }
        templateId: { $ref: '#/components/schemas/Id' }
        status: { type: string, enum: [not_started, on_track, at_risk, completed] }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
        tasks: { type: array, items: { $ref: '#/components/schemas/OnboardingTask' } }
    OnboardingTask:
      type: object
      required: [id, title, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        status: { type: string, enum: [open, completed] }
        dueDate: { type: [string, 'null'], format: date }
        completedAt: { type: [string, 'null'], format: date-time }
    CreateDocumentUploadIntent:
      type: object
      required: [filename, contentType, sizeBytes, employeeId, category]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }
        contentType: { type: string, maxLength: 120 }
        sizeBytes: { type: integer, minimum: 1, maximum: 52428800 }
        employeeId: { $ref: '#/components/schemas/Id' }
        category: { type: string, enum: [contract, identity, compliance, certification, other] }
        expiresOn: { type: string, format: date }
    DocumentUploadIntent:
      type: object
      required: [document, uploadUrl, expiresAt]
      properties:
        document: { $ref: '#/components/schemas/Document' }
        uploadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    Document:
      type: object
      required: [id, employeeId, filename, category, status, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        employeeId: { $ref: '#/components/schemas/Id' }
        filename: { type: string }
        category: { type: string }
        expiresOn: { type: [string, 'null'], format: date }
        status: { type: string, enum: [pending_upload, pending_scan, available, quarantined, deleted] }
        createdAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri, example: 'https://docs.easyhr.example/errors/forbidden' }
        title: { type: string, example: Forbidden }
        status: { type: integer, example: 403 }
        code: { type: string, example: authorization.insufficient_scope }
        detail: { type: string }
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
