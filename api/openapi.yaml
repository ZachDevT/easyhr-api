openapi: 3.1.0
info:
  title: EasyHR Customer API
  version: 0.1.0
  description: |
    First-contract API for the EasyHR multi-tenant HR platform. The authenticated
    membership determines the organization; clients must never send an organization ID
    to select a tenant. Tenant routes require `X-EasyHR-Workspace`, containing the
    normalized workspace subdomain, in addition to the bearer token. All timestamps
    are RFC 3339 UTC timestamps.
servers:
  - url: https://api.easyhr.example/api/v1
    description: Production (replace with the real domain before launch)
  - url: http://localhost:8080/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Context
  - name: Employees
  - name: Leave
  - name: Attendance
  - name: Onboarding
  - name: Documents
paths:
  /auth/provision:
    post:
      tags: [Context]
      summary: Synchronize the verified identity-provider user into EasyHR
      description: |
        Uses the verified JWT subject to retrieve the account from Clerk and writes
        a local user record. Browser-supplied profile data is not accepted. Call
        this after sign-up/sign-in and before first organization setup.
      operationId: provisionAuthenticatedIdentity
      responses:
        '204':
          description: Local identity provisioned or refreshed
        default:
          $ref: '#/components/responses/Problem'
  /setup/organizations:
    post:
      tags: [Context]
      summary: Create the caller's first EasyHR organization and workspace
      description: |
        This bootstrap route requires a verified bearer token but intentionally does
        not require an existing membership. The Clerk user must already have been
        provisioned locally by the identity sync. It creates the organization, legal
        profile, workspace, owner membership and initial departments atomically.
      operationId: createOrganizationSetup
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationSetupRequest' }
      responses:
        '201':
          description: Organization and owner membership created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationSetupResponse' }
        default:
          $ref: '#/components/responses/Problem'
  /me:
    get:
      tags: [Context]
      summary: Get the authenticated user and active organization membership
      operationId: getMe
      responses:
        '200':
          description: Current user context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContextResponse'
        default:
          $ref: '#/components/responses/Problem'
  /employees:
    get:
      tags: [Employees]
      summary: List employees visible to the caller
      operationId: listEmployees
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          schema: { type: string, maxLength: 120 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/EmployeeStatus' }
        - name: departmentId
          in: query
          schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: A stable, cursor-paginated page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeePage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Employees]
      summary: Create an employee record
      operationId: createEmployee
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEmployeeRequest' }
      responses:
        '201':
          description: Employee created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateEmployeeResponse' }
        default:
          $ref: '#/components/responses/Problem'
  /employees/{employeeId}:
    parameters:
      - $ref: '#/components/parameters/EmployeeId'
    get:
      tags: [Employees]
      summary: Get an employee record
      operationId: getEmployee
      responses:
        '200':
          description: Employee
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        default:
          $ref: '#/components/responses/Problem'
  /departments:
    get:
      tags: [Organization]
      summary: List departments
      operationId: listDepartments
      responses:
        '200':
          description: Departments
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Department' }
        default:
          $ref: '#/components/responses/Problem'
  /divisions:
    get:
      tags: [Organization]
      summary: List divisions
      operationId: listDivisions
      responses:
        '200':
          description: Divisions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Division' }
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Organization]
      summary: Create a division
      operationId: createDivision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDivisionRequest' }
      responses:
        '201':
          description: Division created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Division' }
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Organization]
      summary: Create a department
      operationId: createDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDepartmentRequest' }
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Department' }
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Employees]
      summary: Update permitted employee profile fields
      description: Compensation, legal identity and employment-term changes use separate audited endpoints.
      operationId: updateEmployee
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEmployeeRequest' }
      responses:
        '200':
          description: Updated employee
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        default:
          $ref: '#/components/responses/Problem'
  /leave/balances:
    get:
      tags: [Leave]
      summary: List leave balances the caller may view
      operationId: listLeaveBalances
      parameters:
        - name: employeeId
          in: query
          schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Leave ledger balances
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LeaveBalance' }
        default:
          $ref: '#/components/responses/Problem'
  /leave/requests:
    get:
      tags: [Leave]
      summary: List leave requests visible to the caller
      operationId: listLeaveRequests
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: employeeId
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/LeaveRequestStatus' }
      responses:
        '200':
          description: Leave request page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequestPage' }
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Leave]
      summary: Submit a leave request
      operationId: createLeaveRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLeaveRequest' }
      responses:
        '201':
          description: Request submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequest' }
        default:
          $ref: '#/components/responses/Problem'
  /leave/requests/{requestId}/approve:
    post:
      tags: [Leave]
      summary: Approve a pending leave request
      operationId: approveLeaveRequest
      parameters:
        - $ref: '#/components/parameters/LeaveRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Request approved and ledger reservation recorded atomically
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequestDecision' }
        default:
          $ref: '#/components/responses/Problem'
  /leave/requests/{requestId}/decline:
    post:
      tags: [Leave]
      summary: Decline a pending leave request
      operationId: declineLeaveRequest
      parameters:
        - $ref: '#/components/parameters/LeaveRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: Request declined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequestDecision' }
        default:
          $ref: '#/components/responses/Problem'
  /leave/requests/{requestId}/cancel:
    post:
      tags: [Leave]
      summary: Cancel the caller's pending leave request
      operationId: cancelLeaveRequest
      parameters:
        - $ref: '#/components/parameters/LeaveRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Request cancelled and reservation released
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequestDecision' }
        default:
          $ref: '#/components/responses/Problem'
  /attendance/punches:
    get:
      tags: [Attendance]
      summary: List attendance punches for an employee
      operationId: listAttendancePunches
      parameters:
        - name: employeeId
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Id' }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Attendance-punch page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendancePunchPage' }
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Attendance]
      summary: Record an employee clock-in or clock-out punch
      description: The server determines organization, employee eligibility, time zone and policy outcome. Client location is evidence, not proof.
      operationId: createAttendancePunch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAttendancePunch' }
      responses:
        '201':
          description: Immutable attendance punch recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendancePunch' }
        default:
          $ref: '#/components/responses/Problem'
  /attendance/live:
    get:
      tags: [Attendance]
      summary: List today's attendance status for authorized team scope
      operationId: getLiveAttendance
      parameters:
        - name: date
          in: query
          description: Local organization date; defaults to today.
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { type: string, enum: [clocked_in, clocked_out, late, missing] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Live attendance page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveAttendancePage' }
        default:
          $ref: '#/components/responses/Problem'
  /attendance/punches/{punchId}/corrections:
    post:
      tags: [Attendance]
      summary: Create an audited correction to an attendance punch
      operationId: createAttendanceCorrection
      parameters:
        - $ref: '#/components/parameters/PunchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAttendanceCorrection' }
      responses:
        '201':
          description: Correction recorded; original punch remains unchanged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendancePunch' }
        default:
          $ref: '#/components/responses/Problem'
  /onboarding/templates:
    post:
      tags: [Onboarding]
      summary: Create a draft onboarding template
      operationId: createOnboardingTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOnboardingTemplate' }
      responses:
        '201':
          description: Draft template created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingTemplate' }
        default:
          $ref: '#/components/responses/Problem'
    get:
      tags: [Onboarding]
      summary: List onboarding templates
      operationId: listOnboardingTemplates
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, published, archived] }
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OnboardingTemplate' }
        default:
          $ref: '#/components/responses/Problem'
  /onboarding/templates/{templateId}/publish:
    post:
      tags: [Onboarding]
      summary: Publish a draft onboarding template
      operationId: publishOnboardingTemplate
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200':
          description: Published template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingTemplate' }
        default:
          $ref: '#/components/responses/Problem'
  /onboarding/instances:
    post:
      tags: [Onboarding]
      summary: Start onboarding for an employee from a template
      operationId: createOnboardingInstance
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOnboardingInstance' }
      responses:
        '201':
          description: Onboarding instance and tasks created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingInstance' }
        default:
          $ref: '#/components/responses/Problem'
  /onboarding/tasks/{taskId}:
    patch:
      tags: [Onboarding]
      summary: Complete or reopen an onboarding task
      operationId: updateOnboardingTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [completed, open] }
                note: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingTask' }
        default:
          $ref: '#/components/responses/Problem'
  /documents/upload-intents:
    post:
      tags: [Documents]
      summary: Request a one-time private upload URL for a document
      operationId: createDocumentUploadIntent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDocumentUploadIntent' }
      responses:
        '201':
          description: Pending document and short-lived upload URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentUploadIntent' }
        default:
          $ref: '#/components/responses/Problem'
  /documents:
    get:
      tags: [Documents]
      summary: List document metadata for an employee
      operationId: listDocuments
      parameters:
        - name: employeeId
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Id' }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Document metadata
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Document' }
        default:
          $ref: '#/components/responses/Problem'
  /documents/{documentId}/complete:
    post:
      tags: [Documents]
      summary: Complete document upload after the object store receives the blob
      operationId: completeDocumentUpload
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checksumSha256]
              properties:
                checksumSha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
      responses:
        '200':
          description: Document accepted for malware scan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        default:
          $ref: '#/components/responses/Problem'
  /documents/{documentId}/download-url:
    get:
      tags: [Documents]
      summary: Request a short-lived download URL for a safe document
      operationId: getDocumentDownloadUrl
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Time-bound URL, issued after authorization and scan checks
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        default:
          $ref: '#/components/responses/Problem'
  /payroll/configurations:
    get:
      tags: [Payroll]
      summary: List payroll configurations
      operationId: listPayrollConfigurations
      responses:
        '200':
          description: A list of payroll configurations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PayrollConfiguration' }
        default:
          $ref: '#/components/responses/Problem'
  /payroll/periods:
    get:
      tags: [Payroll]
      summary: List payroll periods
      operationId: listPayrollPeriods
      responses:
        '200':
          description: A list of payroll periods
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PayrollPeriod' }
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Payroll]
      summary: Create a payroll period
      operationId: createPayrollPeriod
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePayrollPeriod' }
      responses:
        '200':
          description: The created payroll period
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollPeriod' }
        default:
          $ref: '#/components/responses/Problem'
  /payroll/periods/{periodId}/runs:
    post:
      tags: [Payroll]
      summary: Initiate a payroll run calculation
      operationId: createPayrollRun
      parameters:
        - $ref: '#/components/parameters/PeriodId'
      responses:
        '200':
          description: The initiated payroll run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollRun' }
        default:
          $ref: '#/components/responses/Problem'
  /payroll/runs/{runId}/lock:
    post:
      tags: [Payroll]
      summary: Lock a payroll run and generate paystubs
      operationId: lockPayrollRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '204':
          description: Payroll run locked successfully
        default:
          $ref: '#/components/responses/Problem'

  /documents/{documentId}/signature-requests:
    post:
      tags: [Signatures]
      summary: Send a document for electronic signature
      operationId: createSignatureRequest
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSignatureRequest' }
      responses:
        '200':
          description: The created signature request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignatureRequest' }
        default:
          $ref: '#/components/responses/Problem'
  /signature-requests:
    get:
      tags: [Signatures]
      summary: List signature requests
      operationId: listSignatureRequests
      responses:
        '200':
          description: A list of signature requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SignatureRequest' }
        default:
          $ref: '#/components/responses/Problem'

  /employee-relations/cases:
    post:
      tags: [Employee Relations]
      summary: Create a new relation case
      operationId: createRelationCase
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRelationCase' }
      responses:
        '200':
          description: The created case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelationCase' }
        default:
          $ref: '#/components/responses/Problem'
    get:
      tags: [Employee Relations]
      summary: List relation cases
      operationId: listRelationCases
      responses:
        '200':
          description: A list of relation cases
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RelationCase' }
        default:
          $ref: '#/components/responses/Problem'
  /employee-relations/cases/{caseId}/actions:
    post:
      tags: [Employee Relations]
      summary: Execute a disciplinary action on a case
      operationId: executeRelationAction
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRelationAction' }
      responses:
        '200':
          description: The executed action
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelationAction' }
        default:
          $ref: '#/components/responses/Problem'

  /public/jobs:
    get:
      tags: [Hiring Public]
      summary: List published job postings (Public)
      operationId: listPublicJobs
      parameters:
        - name: organizationId
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: A list of published job postings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JobPosting' }
        default:
          $ref: '#/components/responses/Problem'
  /public/jobs/{postingId}/apply:
    post:
      tags: [Hiring Public]
      summary: Submit a job application (Public)
      operationId: applyForJob
      parameters:
        - $ref: '#/components/parameters/PostingId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyForJob' }
      responses:
        '200':
          description: Application submitted successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobApplicant' }
        default:
          $ref: '#/components/responses/Problem'
  /hiring/postings:
    get:
      tags: [Hiring]
      summary: List all job postings
      operationId: listJobPostings
      responses:
        '200':
          description: A list of job postings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JobPosting' }
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Hiring]
      summary: Create a job posting
      operationId: createJobPosting
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateJobPosting' }
      responses:
        '200':
          description: The created job posting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPosting' }
        default:
          $ref: '#/components/responses/Problem'
  /hiring/applicants/{applicantId}/offers:
    post:
      tags: [Hiring]
      summary: Create a job offer for an applicant
      operationId: createJobOffer
      parameters:
        - $ref: '#/components/parameters/ApplicantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateJobOffer' }
      responses:
